name: Daily LLM Infra Watch

on:
  schedule:
    # 08:05 Asia/Singapore = 00:05 UTC
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "llm-infra-watch"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Re-runs keep the original GITHUB_SHA, which may be behind after a
          # previous attempt committed generated data. Always start from the
          # latest branch tip so the generated-data push remains fast-forward.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect GitHub changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_changes.py

      - name: Commit generated data
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- site/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "chore: update daily infra watch data"

          # main may advance while collection is running. Rebase the generated
          # data commit and retry instead of failing on a non-fast-forward push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push generated data after $attempt attempts" >&2
              exit 1
            fi

            echo "main advanced during collection; rebasing before retry $((attempt + 1))"
            git fetch origin main
            git rebase origin/main
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
